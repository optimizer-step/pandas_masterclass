<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LLM → Jev → CDM</title>
<style>
  html, body { margin: 0; background: #000; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  canvas { height: 96vh; aspect-ratio: 9 / 16; display: block; }
  body.capture canvas { width: 1080px; height: 1920px; }
  #play { position: fixed; inset: 0; background: #000c; color: #fff; font: 600 28px Inter, sans-serif;
          display: flex; align-items: center; justify-content: center; cursor: pointer; }
  body.capture #play { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="play">▶ Play preview</div>
<script>
// ---------------------------------------------------------------------------
// LLM → Jev → CDM, v2. One continuous point-cloud "model" morphs between the
// ideas: sphere (LLM) → probability bars (Jev) → schema card (CDM) → speed
// ring → schema card (caveat) → tri-colour sphere (finale). Every frame is a
// pure function of t, so preview and capture are identical.
// ---------------------------------------------------------------------------
const W = 1080, H = 1920, M = 96;               // canvas + side margin
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  bg: '#08080a', ink: '#f2f2f5', mute: '#8d8d99', faint: 'rgba(255,255,255,0.13)', gray: '#5a5b66',
  llm: '#ff8a3d', jev: '#3ce0c8', cdm: '#9d8cff', red: '#ff5d6c', green: '#5fe39a',
};
const DISPLAY = '"Inter Display", Inter, sans-serif';
const SANS = 'Inter, sans-serif';
const MONO = '"JetBrains Mono", monospace';

let TL, E;              // timeline + shared events
const SC = {};

// ---------------- math ----------------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eQuint = k => 1 - Math.pow(1 - k, 5);
const eCubic = k => 1 - Math.pow(1 - k, 3);
const eInOut = k => k < .5 ? 16 * k ** 5 : 1 - Math.pow(-2 * k + 2, 5) / 2;
const eIn = k => k * k * k;
const eExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function rgba(c, a) { return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`; }
function hexA(h, a) { return rgba(hex(h), a); }
function mixC(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
const st = (id, i) => SC[id].sentences[i].t0;
const se = (id, i) => SC[id].sentences[i].t1;
function wordT(id, i, re) { const w = SC[id].sentences[i].words.find(w => re.test(w.w)); return w ? w.t0 : st(id, i); }

// ---------------- type ----------------
function setFont(size, weight, fam, spacing = 0) { ctx.font = `${weight} ${size}px ${fam}`; ctx.letterSpacing = spacing + 'px'; }
function measure(s, size, weight = 600, fam = SANS, spacing = 0) { setFont(size, weight, fam, spacing); return ctx.measureText(s).width; }
function txt(s, x, y, { size = 40, weight = 500, fam = SANS, color = C.ink, align = 'left', alpha = 1, spacing = 0 } = {}) {
  if (alpha <= 0.002) return;
  ctx.save(); ctx.globalAlpha *= alpha; setFont(size, weight, fam, spacing);
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.restore();
}
// Masked line reveal: text rises from behind an invisible edge, exits upward.
function maskText(s, x, y, size, opts, kin, kout = 0) {
  if (kin <= 0 || kout >= 1) return;
  const w = measure(s, size, opts.weight || 600, opts.fam || SANS, opts.spacing || 0) + 20;
  const x0 = opts.align === 'right' ? x - w : opts.align === 'center' ? x - w / 2 : x - 10;
  ctx.save();
  ctx.beginPath(); ctx.rect(x0, y - size * 1.05, w + 20, size * 1.4); ctx.clip();
  const dy = (1 - eQuint(kin)) * size * 1.35 - eIn(kout) * size * 1.35;
  txt(s, x, y + dy, { ...opts, size });
  ctx.restore();
}
// Headline: per-word masked stagger, left aligned.
function headline(s, x, y, size, t, t0, tout, color = C.ink, weight = 700) {
  let cx = x;
  s.split(' ').forEach((w, i) => {
    const kin = prog(t, t0 + i * .07, t0 + i * .07 + .75), kout = prog(t, tout + i * .04, tout + i * .04 + .45);
    maskText(w, cx, y, size, { weight, fam: DISPLAY, color, spacing: -size * .025 }, kin, kout);
    cx += measure(w + ' ', size, weight, DISPLAY, -size * .025);
  });
}
function hair(x1, y1, x2, y2, alpha = 1, color = C.faint, lw = 1.5) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}
function box(x, y, w, h, r, { fill, stroke, lw = 1.5, alpha = 1 } = {}) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  ctx.restore();
}
function dot(x, y, r, color, alpha = 1) {
  if (alpha <= 0 || r <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); ctx.restore();
}
// Section label: "01  LARGE LANGUAGE MODEL ——————"
function sectionLabel(num, label, color, t, t0, tout) {
  const kin = prog(t, t0, t0 + .6), kout = prog(t, tout, tout + .4);
  const y = 268;
  maskText(num, M, y, 24, { weight: 700, fam: MONO, color, spacing: 2 }, kin, kout);
  maskText(label, M + 58, y, 24, { weight: 600, fam: MONO, color: C.mute, spacing: 4 }, prog(t, t0 + .08, t0 + .7), kout);
  const lx = M + 70 + measure(label, 24, 600, MONO, 4);
  const lk = eQuint(prog(t, t0 + .2, t0 + 1.1));
  hair(lx + 10, y - 8, lerp(lx + 10, W - M, lk), y - 8, 1 - eIn(kout));
}

// ---------------- grain ----------------
const grains = [0, 1, 2].map(s => {
  const g = document.createElement('canvas'); g.width = g.height = 256;
  const gx = g.getContext('2d'), im = gx.createImageData(256, 256);
  for (let i = 0; i < im.data.length; i += 4) { const v = rnd(i * .37 + s * 999) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  gx.putImageData(im, 0, 0); return g;
});
function grain(t) {
  const f = Math.floor(t * 24);
  ctx.save(); ctx.globalAlpha = .045; ctx.globalCompositeOperation = 'overlay';
  const g = grains[f % 3], ox = -Math.floor(rnd(f) * 256), oy = -Math.floor(rnd(f + 7) * 256);
  for (let y = oy; y < H; y += 256) for (let x = ox; x < W; x += 256) ctx.drawImage(g, x, y);
  ctx.restore();
}

// ---------------- point cloud ----------------
const N = 420;
const SPH = [], EDGES = [];
for (let i = 0; i < N; i++) {                      // Fibonacci sphere
  const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.399963;
  SPH.push([Math.cos(th) * r, y, Math.sin(th) * r]);
}
for (let i = 0; i < N; i++) {                      // 3 nearest neighbours → edges
  const d = [];
  for (let j = 0; j < N; j++) if (j !== i) d.push([(SPH[i][0] - SPH[j][0]) ** 2 + (SPH[i][1] - SPH[j][1]) ** 2 + (SPH[i][2] - SPH[j][2]) ** 2, j]);
  d.sort((a, b) => a[0] - b[0]);
  for (let k = 0; k < 3; k++) if (i < d[k][1]) EDGES.push([i, d[k][1]]);
}
const ORDER = [...Array(N).keys()].sort((a, b) => rnd(a + 50) - rnd(b + 50));   // random assignment order
const DELAY = Array.from({ length: N }, (_, i) => rnd(i + 90) * .35);

// Jev bars: points fill three bars proportional to probability.
const PROBS = [.82, .15, .03], BAR_Y = [1130, 1225, 1320], BAR_X = 318, BAR_L = 560, BAR_H = 24;
const BARS = new Array(N), BAR_OF = new Array(N);
{
  const counts = [Math.round(N * .82), Math.round(N * .15)]; counts.push(N - counts[0] - counts[1]);
  let k = 0;
  counts.forEach((c, b) => {
    const len = Math.max(BAR_H, BAR_L * PROBS[b]);
    const rows = 4, cols = Math.ceil(c / rows);
    for (let j = 0; j < c; j++, k++) {
      const i = ORDER[k], col = Math.floor(j / rows), row = j % rows;
      BARS[i] = [BAR_X + (cols > 1 ? col / (cols - 1) : 0) * len, BAR_Y[b] - BAR_H / 2 + row / (rows - 1) * BAR_H, 0]; BAR_OF[i] = b;
    }
  });
}
// Schema card: points trace the card outline and three value slots.
const CARD = { x: M, y: 560, w: W - 2 * M, h: 440 };
const SLOT_Y = [690, 810, 930], SLOT = { x: 520, w: 400, h: 70 };
const GRID = new Array(N), SLOT_OF = new Array(N);
{
  const rects = [[CARD.x, CARD.y, CARD.w, CARD.h, -1], ...SLOT_Y.map((y, s) => [SLOT.x, y - SLOT.h / 2, SLOT.w, SLOT.h, s])];
  const per = rects.map(r => 2 * (r[2] + r[3])), tot = per.reduce((a, b) => a + b);
  let k = 0;
  rects.forEach((r, ri) => {
    const n = ri === rects.length - 1 ? N - k : Math.round(N * per[ri] / tot);
    for (let j = 0; j < n; j++, k++) {
      let d = (j / n) * per[ri]; const [x, y, w, h, s] = r; let p;
      if (d < w) p = [x + d, y]; else if ((d -= w) < h) p = [x + w, y + d]; else if ((d -= h) < w) p = [x + w - d, y + h]; else p = [x, y + h - (d - w)];
      GRID[ORDER[k]] = [p[0], p[1], 0]; SLOT_OF[ORDER[k]] = s;
    }
  });
}

function sphereAt(i, cx, cy, R, ang) {
  const [x, y, z] = SPH[i];
  const x1 = x * Math.cos(ang) - z * Math.sin(ang), z1 = x * Math.sin(ang) + z * Math.cos(ang);
  const tl = .38, y2 = y * Math.cos(tl) - z1 * Math.sin(tl), z2 = y * Math.sin(tl) + z1 * Math.cos(tl);
  const s = 1100 / (1100 + z2 * R);
  return [cx + x1 * R * s, cy + y2 * R * s, s, (1 - z2) / 2, Math.atan2(x1, z1)];
}

const CL = hex(C.llm), CJ = hex(C.jev), CD = hex(C.cdm), CG = hex(C.gray), CR = hex(C.red);
const BLUE = hex('#4a8fe8'), GOLD = hex('#ffb547');
// Shape keyframes: [start, duration, fn(i, t) -> {x, y, r, a, c, d}]
function keys() {
  const sph = (cx, cy, R, colorFn) => (i, t) => {
    const [x, y, s, d, lon] = sphereAt(i, cx(t), cy(t), R(t), t * .22 + .6);
    return { x, y, r: 2.3 * s, a: .22 + .78 * d * d, c: colorFn(i, t, lon), d };
  };
  const llmToJev = t => eInOut(prog(t, SC.jev.t0 - .2, SC.jev.t0 + .9));
  const sphereMain = sph(t => 540, t => lerp(800, 965, llmToJev(t)), t => lerp(215, 125, llmToJev(t)),
    (i, t) => mixC(CL, CJ, eInOut(prog(t, SC.jev.t0 - .3, SC.jev.t0 + .5))));
  const bars = (i, t) => ({ x: BARS[i][0], y: BARS[i][1], r: 2.2, a: BAR_OF[i] === 0 ? .95 : .7, c: BAR_OF[i] === 0 ? CJ : CG });
  const grid = red => (i, t) => {
    const wrong = red && SLOT_OF[i] === 0 ? eCubic(prog(t, wordT('end', 0, /correct/) - .1, wordT('end', 0, /correct/) + .4)) : 0;
    return { x: GRID[i][0], y: GRID[i][1], r: 2.1, a: SLOT_OF[i] === -1 ? .55 : .9, c: mixC(CD, CR, wrong) };
  };
  const ring = (i, t) => {
    const a = (i / N) * 6.2832 + t * .5, rr = 330 + (rnd(i + 11) - .5) * 26;
    return { x: 540 + Math.cos(a) * rr, y: 880 + Math.sin(a) * rr, r: 2.2, a: .35 + .65 * rnd(i + 12), c: CD };
  };
  const logoRing = (i, t) => {
    const a = (i / N) * 6.2832 - 1.5708 + t * .25, rr = RING.r + (rnd(i + 21) - .5) * 6;
    const x = RING.x + Math.cos(a) * rr, y = RING.y + Math.sin(a) * rr;
    return { x, y, r: 2.2, a: .9, c: mixC(BLUE, GOLD, clamp((x - RING.x + RING.r) / (2 * RING.r))) };
  };
  const finale = sph(t => 540, t => 1180, t => 210, (i, t, lon) => {
    const s = ((lon + Math.PI) / 6.2832 * 3) | 0; return [CL, CJ, CD][s % 3];
  });
  return [
    [-1, .01, sphereMain],
    [E.jev_pass + .12, .95, bars],
    [SC.cdm.t0 + .15, 1.1, grid(false)],
    [E.claim - .55, .9, ring],
    [SC.end.t0 + .05, 1.0, grid(true)],
    [E.finale[0] - .15, 1.1, finale],
    [SC.outro.t0 - .3, 1.0, logoRing],
  ];
}
let KEYS = null;
function points(t) {
  let k = 0; while (k + 1 < KEYS.length && t >= KEYS[k + 1][0]) k++;
  const [t0, dur, fn] = KEYS[k], prev = k ? KEYS[k - 1][2] : fn;
  const out = new Array(N);
  for (let i = 0; i < N; i++) {
    const b = fn(i, t), m = eInOut(prog(t, t0 + DELAY[i], t0 + DELAY[i] + dur));
    if (m >= 1 || prev === fn) { out[i] = b; continue; }
    const a = prev(i, t);
    out[i] = { x: lerp(a.x, b.x, m), y: lerp(a.y, b.y, m), r: lerp(a.r, b.r, m), a: lerp(a.a, b.a, m), c: mixC(a.c, b.c, m), d: lerp(a.d ?? .8, b.d ?? .8, m) };
  }
  const edgeA = k === 0 ? 1 - eCubic(prog(t, E.jev_pass, E.jev_pass + .4)) : k === 5 ? eInOut(prog(t, t0 + .6, t0 + 1.6)) : k === 6 ? 1 - eCubic(prog(t, t0, t0 + .5)) : 0;
  return { pts: out, edgeA };
}
function drawCloud(t, fade) {
  const { pts, edgeA } = points(t);
  // LLM token pulse: a bright band sweeps down the sphere on each forward pass
  let pulse = -9, flash = 0;
  for (const tk of E.tokens) if (t >= tk && t < tk + .4) { pulse = (t - tk) / .3; flash = Math.exp(-(t - tk) / .12); }
  // Jev single pass: a vertical scan line crosses the sphere once
  const scan = prog(t, E.jev_pass - .7, E.jev_pass);
  const scanOn = scan > 0 && scan < 1;
  const scanX = 540 + lerp(-150, 150, eInOut(scan));
  if (edgeA > 0) {
    ctx.save(); ctx.globalAlpha = .13 * edgeA * fade; ctx.lineWidth = 1;
    ctx.strokeStyle = rgba(pts[0].c, 1); ctx.beginPath();
    for (const [i, j] of EDGES) { const a = pts[i], b = pts[j]; if ((a.d + b.d) < .7) continue; ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
    ctx.stroke(); ctx.restore();
  }
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < N; i++) {
    const p = pts[i];
    let boost = flash * .35;
    if (pulse > -1) { const ny = (SPH[i][1] + 1) / 2; boost += Math.max(0, 1 - Math.abs(ny - pulse) * 6) * .9; }
    if (scanOn) boost += Math.max(0, 1 - Math.abs(p.x - scanX) / 28) * 1.2;
    const a = clamp(p.a + boost) * fade;
    ctx.fillStyle = rgba(p.c, a);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + boost * .5), 0, 6.2832); ctx.fill();
    if (boost > .3) { ctx.fillStyle = rgba(p.c, .12 * boost * fade); ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 5, 0, 6.2832); ctx.fill(); }
  }
  ctx.restore();
  if (scanOn) {
    const g = ctx.createLinearGradient(scanX - 30, 0, scanX + 30, 0);
    g.addColorStop(0, hexA(C.jev, 0)); g.addColorStop(.5, hexA(C.jev, .5 * fade)); g.addColorStop(1, hexA(C.jev, 0));
    ctx.fillStyle = g; ctx.fillRect(scanX - 30, 815, 60, 300);
  }
}

// ---------------- background ----------------
function accentAt(t) {
  const segs = [[0, CL], [SC.jev.t0, CJ], [SC.cdm.t0, CD], [SC.end.t0, CR], [E.finale[0], CD], [SC.outro.t0, hex('#3a6fd8')]];
  let c = segs[0][1];
  for (let i = 1; i < segs.length; i++) c = mixC(c, segs[i][1], eInOut(prog(t, segs[i][0] - .5, segs[i][0] + .7)));
  return c;
}
function background(t, acc) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const gx = 540 + Math.sin(t * .2) * 120, gy = 880 + Math.cos(t * .15) * 120;
  let g = ctx.createRadialGradient(gx, gy, 0, gx, gy, 820);
  g.addColorStop(0, rgba(acc, .13)); g.addColorStop(.6, rgba(acc, .03)); g.addColorStop(1, rgba(acc, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) {                   // sparse depth dust
    const z = .3 + rnd(i + 1) * .7, y = ((rnd(i + 2) * H - t * 14 * z) % H + H) % H, x = rnd(i + 3) * W + Math.sin(t * .3 + i) * 10 * z;
    dot(x, y, .8 + z * 1.2, '#ffffff', .05 + .12 * z * rnd(i + 4));
  }
  g = ctx.createRadialGradient(540, 960, 520, 540, 960, 1300);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------------- captions ----------------
function captions(t) {
  let sent = null;
  for (const s of TL.scenes) if (s.id !== 'outro') for (const x of s.sentences) if (t >= x.t0 - .1 && t <= x.t1 + .3) sent = x;
  if (!sent) return;
  const chunks = []; let cur = [];
  for (const w of sent.words) {
    if (cur.length && measure([...cur, w].map(x => x.w).join(' '), 42, 600, SANS) > 880) { chunks.push(cur); cur = []; }
    cur.push(w); if (/[.,:]$/.test(w.w) && cur.length >= 3) { chunks.push(cur); cur = []; }
  }
  if (cur.length) { const last = chunks[chunks.length - 1]; if (cur.length < 3 && last && measure([...last, ...cur].map(x => x.w).join(' '), 42, 600, SANS) <= 880) last.push(...cur); else chunks.push(cur); }
  let ci = chunks.findIndex(c => t < c[c.length - 1].t1 + .05); if (ci < 0) ci = chunks.length - 1;
  const ch = chunks[ci], s = ch.map(w => w.w).join(' ');
  const a = eCubic(prog(t, ch[0].t0 - .1, ch[0].t0 + .1)) * (1 - prog(t, sent.t1 + .1, sent.t1 + .3));
  const size = 42, y = 1640;
  let x = 540 - measure(s, size, 600, SANS) / 2;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 18;
  for (const w of ch) {
    const ww = measure(w.w + ' ', size, 600, SANS);
    const k = prog(t, w.t0 - .05, w.t0 + .12);
    txt(w.w, x, y, { size, weight: 600, color: C.ink, alpha: a * (.32 + .68 * k) });
    x += ww;
  }
  ctx.restore();
}

// ======================= 01 · LLM ==========================================
const TOKENS = 'Based on the content of this email, it shows classic phishing signs: an urgent tone, a spoofed sender and a suspicious link. Overall, this is likely spam .'.split(' ');
const SPAM = TOKENS.indexOf('spam');
let tokLayout;
function layoutTokens() {
  setFont(31, 500, MONO); const sp = ctx.measureText(' ').width;
  let x = 0, y = 0; tokLayout = [];
  TOKENS.forEach(tk => {
    const w = ctx.measureText(tk).width, glue = tk === '.';
    if (glue) x -= sp; else if (x + w > W - 2 * M) { x = 0; y += 48; }
    tokLayout.push({ x: M + x, y: 1190 + y, w }); x += w + sp;
  });
}
function sLLM(t) {
  const out = SC.jev.t0 - .55;
  sectionLabel('01', 'LARGE LANGUAGE MODEL', C.llm, t, .15, out);
  headline('LLMs write.', M, 410, 116, t, .35, out);
  maskText('one token at a time', M, 478, 40, { weight: 500, color: C.mute }, prog(t, wordT('llm', 0, /token/) - .2, wordT('llm', 0, /token/) + .6), prog(t, out, out + .45));
  const pk = eQuint(prog(t, E.tokens[0] - .6, E.tokens[0]));
  const po = 1 - eCubic(prog(t, out, out + .5));
  maskText('OUTPUT', M, 1120, 22, { weight: 600, fam: MONO, color: C.mute, spacing: 4 }, pk, prog(t, out, out + .4));
  hair(M, 1136, lerp(M, W - M, pk), 1136, po);
  let n = 0; while (n < TOKENS.length && n < E.tokens.length && t >= E.tokens[n]) n++;
  maskText('PASS ' + String(n).padStart(2, '0'), W - M, 1120, 22, { weight: 700, fam: MONO, color: C.llm, spacing: 3, align: 'right' }, pk, prog(t, out, out + .4));
  const oneT = wordT('llm', 2, /^one/);
  const hl = eCubic(prog(t, oneT - .3, oneT + .3));
  for (let i = 0; i < n; i++) {
    const L = tokLayout[i], age = t - E.tokens[i];
    const fresh = Math.exp(-age / .35);

// ======================= END CARD · OPTIMIZER STEP =========================
// The logo is a 1254² raster; it's revealed in layers (emblem, wordmark,
// divider) and composited with 'screen' so its dark backdrop melts into ours.
const LG = { s: .75, x0: 540 - 627 * .75, y0: 288 };
const LX = x => LG.x0 + x * LG.s, LY = y => LG.y0 + y * LG.s;
const RING = { x: LX(622), y: LY(557), r: 501 * LG.s };
const BALLS = [[348, 239], [434, 328], [510, 427], [592, 538], [677, 649], [776, 773]].map(([x, y]) => [LX(x), LY(y)]);
const STARS = [[560, 140], [640, 95], [700, 190], [770, 120], [850, 170], [965, 205], [600, 250], [905, 110], [1010, 300], [480, 200]].map(([x, y]) => [LX(x), LY(y)]);
let LOGO_IMG, WM, KEY;     // KEY: wordmark + divider band (logo y 880–1120) with the backdrop keyed out

function ballAt(t) {
  const o = E.outro;
  if (t < o.start) return { x: BALLS[0][0], y: BALLS[0][1] };
  const ts = [o.start, ...o.steps];
  let i = 0; while (i < 5 && t >= ts[i + 1]) i++;
  if (i >= 5) {                                            // settled at the minimum, tiny bounce
    const k = t - o.land;
    return { x: BALLS[5][0], y: BALLS[5][1] - Math.abs(Math.sin(k * 14)) * 10 * Math.exp(-k * 6) };
  }
  const k = prog(t, ts[i], ts[i + 1]), e = eInOut(k);
  const [ax, ay] = BALLS[i], [bx, by] = BALLS[i + 1];
  return { x: lerp(ax, bx, e), y: lerp(ay, by, e) - Math.sin(Math.PI * k) * 26 };
}
function glowBall(x, y, r, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
  g.addColorStop(0, `rgba(255,250,235,${a})`); g.addColorStop(.18, `rgba(255,214,120,${a})`);
  g.addColorStop(.45, `rgba(255,170,60,${.35 * a})`); g.addColorStop(1, 'rgba(255,150,40,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 4, 0, 6.2832); ctx.fill();
}
function sparkle(x, y, r, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = '#fff'; ctx.lineCap = 'round';
  ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.moveTo(x, y - r); ctx.lineTo(x, y + r); ctx.stroke();
  ctx.restore(); dot(x, y, 2, '#ffffff', a);
}
function sOutro(t) {
  const o = E.outro;
  // whole lockup: settle-in scale + slow drift once landed
  const sc = 1 + .045 * (1 - eQuint(prog(t, o.reveal, o.reveal + 1.6))) + .02 * prog(t, o.land, TL.duration);
  const fy = Math.sin((t - o.land) * 1.4) * 4 * prog(t, o.land, o.land + 1);
  ctx.save();
  ctx.translate(RING.x, RING.y + fy); ctx.scale(sc, sc); ctx.translate(-RING.x, -RING.y);

  // backdrop glow
  const gk = eCubic(prog(t, o.reveal - .3, o.reveal + .8));
  let g = ctx.createRadialGradient(RING.x, RING.y, 0, RING.x, RING.y, 700);
  g.addColorStop(0, `rgba(58,111,216,${.22 * gk})`); g.addColorStop(1, 'rgba(58,111,216,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // ring draws itself (the dots have just formed it), then hands over to the logo's own ring
  const rk = eInOut(prog(t, o.ring, o.reveal + .2)), ra = 1 - eCubic(prog(t, o.reveal + .3, o.reveal + 1));
  if (rk > 0 && ra > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha *= ra;
    const lg = ctx.createLinearGradient(RING.x - RING.r, 0, RING.x + RING.r, 0);
    lg.addColorStop(0, '#4a8fe8'); lg.addColorStop(1, '#ffb547');
    ctx.strokeStyle = lg; ctx.lineWidth = 5; ctx.shadowColor = '#ffb547'; ctx.shadowBlur = 24;
    ctx.beginPath(); ctx.arc(RING.x, RING.y, RING.r, -1.5708, -1.5708 + 6.2832 * rk); ctx.stroke();
    ctx.restore();
  }

  // emblem: iris opens from the centre
  const ik = eCubic(prog(t, o.reveal, o.reveal + .85));
  if (ik > 0) {
    ctx.save();
    ctx.beginPath(); ctx.arc(RING.x, RING.y, (RING.r + 40) * ik, 0, 6.2832); ctx.clip();
    ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha *= eCubic(prog(t, o.reveal, o.reveal + .5));
    ctx.drawImage(LOGO_IMG, 0, 0, 1254, 885, LG.x0, LG.y0, 1254 * LG.s, 885 * LG.s);
    ctx.restore();
    const fl = Math.exp(-Math.max(0, t - o.reveal) / .28) * (t >= o.reveal ? 1 : 0);
    g = ctx.createRadialGradient(RING.x, RING.y, 0, RING.x, RING.y, RING.r);
    g.addColorStop(0, `rgba(255,255,255,${.35 * fl})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // twinkling stars in the emblem sky
    STARS.forEach(([x, y], i) => sparkle(x, y, 5 + 4 * rnd(i + 70), ik * Math.max(0, Math.sin(t * (1.6 + rnd(i) * 1.4) + i * 2.1)) * .8));
  }

  // the optimizer step: a glowing ball hops down the loss curve to the minimum
  const ba = eCubic(prog(t, o.start - .45, o.start - .1));
  if (ba > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let j = 8; j >= 1; j--) {                          // motion trail
      const tp = t - j * .022;
      if (tp < o.start || tp > o.land + .1) continue;
      const p = ballAt(tp); glowBall(p.x, p.y, 9 * (1 - j / 10), ba * .25 * (1 - j / 9));
    }
    const charge = t < o.start ? .5 + .5 * Math.sin(t * 22) : 1;
    const p = ballAt(t); glowBall(p.x, p.y, 13, ba * (.75 + .25 * charge));
    // ripple at each landing
    o.steps.forEach((ts, i) => {
      const k = prog(t, ts, ts + .5);
      if (k > 0 && k < 1) {
        ctx.strokeStyle = `rgba(255,200,110,${.7 * (1 - k)})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(BALLS[i + 1][0], BALLS[i + 1][1], 10 + 50 * eCubic(k), 0, 6.2832); ctx.stroke();
      }
    });
    // landing: bloom + shockwave
    const lk = prog(t, o.land, o.land + 1.3);
    if (lk > 0) {
      const [lx, ly] = BALLS[5];
      g = ctx.createRadialGradient(lx, ly, 0, lx, ly, 460);
      g.addColorStop(0, `rgba(255,190,90,${.55 * (1 - eCubic(lk))})`); g.addColorStop(1, 'rgba(255,170,60,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      if (lk < 1) { ctx.strokeStyle = `rgba(255,214,140,${.8 * (1 - lk)})`; ctx.lineWidth = 3 * (1 - lk) + .5;
        ctx.beginPath(); ctx.arc(lx, ly, 20 + 560 * eQuint(lk), 0, 6.2832); ctx.stroke(); }
      const hold = .18 + .06 * Math.sin(t * 3);              // warm glow stays at the minimum
      g = ctx.createRadialGradient(lx, ly, 0, lx, ly, 140);
      g.addColorStop(0, `rgba(255,200,110,${hold * eCubic(lk * 3 > 1 ? 1 : lk * 3)})`); g.addColorStop(1, 'rgba(255,170,60,0)');
      ctx.fillStyle = g; ctx.fillRect(lx - 140, ly - 140, 280, 280);
    }
    ctx.restore();
  }

  // a glint laps the ring every few seconds after landing
  const gp = (t - o.land - .5) % 3.4;
  if (t > o.land + .5 && gp < 1.3) {
    const a0 = -1.5708 + eInOut(gp / 1.3) * 6.2832;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let j = 0; j < 14; j++) {
      ctx.strokeStyle = `rgba(255,236,200,${.5 * (1 - j / 14) * Math.sin(Math.PI * gp / 1.3)})`; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(RING.x, RING.y, RING.r, a0 - (j + 1) * .025, a0 - j * .025); ctx.stroke();
    }
    ctx.restore();
  }

  // wordmark: feathered left-to-right wipe, then a specular sweep
  const wk = prog(t, o.word, o.word + 1.0);
  if (wk > 0) {
    const w = WM.getContext('2d');
    w.globalCompositeOperation = 'source-over'; w.clearRect(0, 0, 1254, 190);
    w.drawImage(KEY, 0, 0, 1254, 190, 0, 0, 1254, 190);
    w.clearRect(570, 158, 112, 32);                        // keep the divider bars out of this layer
    const rx = lerp(-160, 1414, eInOut(wk));
    let mg = w.createLinearGradient(rx - 160, 0, rx, 0);
    mg.addColorStop(0, 'rgba(0,0,0,1)'); mg.addColorStop(1, 'rgba(0,0,0,0)');
    w.globalCompositeOperation = 'destination-in'; w.fillStyle = mg; w.fillRect(0, 0, 1254, 190);
    ctx.save();
    ctx.drawImage(WM, LG.x0, LY(880) + (1 - eQuint(wk)) * 16, 1254 * LG.s, 190 * LG.s);
    // specular sweep: re-add the wordmark through a moving band, so only the letters brighten
    const sk = prog(t, o.shine, o.shine + 1.0);
    if (sk > 0 && sk < 1) {
      const sx = lerp(-250, 1500, eInOut(sk));
      mg = w.createLinearGradient(sx - 140, 0, sx + 140, 190);
      mg.addColorStop(0, 'rgba(0,0,0,0)'); mg.addColorStop(.5, 'rgba(0,0,0,1)'); mg.addColorStop(1, 'rgba(0,0,0,0)');
      w.globalCompositeOperation = 'destination-in'; w.fillStyle = mg; w.fillRect(0, 0, 1254, 190);
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(WM, LG.x0, LY(880), 1254 * LG.s, 190 * LG.s);
      ctx.drawImage(WM, LG.x0, LY(880), 1254 * LG.s, 190 * LG.s);
    }
    ctx.restore();
  }
  // divider: lines grow out from the centre, bars rise
  const dk = eQuint(prog(t, o.divider, o.divider + .8)), bk = eQuint(prog(t, o.divider + .15, o.divider + .75));
  if (dk > 0) {
    ctx.save();
    const L0 = 240, L1 = 565, R0 = 685, R1 = 1030, y0 = 1068, h = 30;
    const lw = (L1 - L0) * dk, rw = (R1 - R0) * dk;
    ctx.drawImage(KEY, L1 - lw, y0 - 880, lw, h, LX(L1 - lw), LY(y0), lw * LG.s, h * LG.s);
    ctx.drawImage(KEY, R0, y0 - 880, rw, h, LX(R0), LY(y0), rw * LG.s, h * LG.s);
    const bh = 78 * bk;
    if (bh > 1) ctx.drawImage(KEY, 572, 238 - bh, 106, bh, LX(572), LY(1118 - bh), 106 * LG.s, bh * LG.s);
    ctx.restore();
  }
  ctx.restore();

  // call to action
  const c0 = o.cta;
  const l1 = 'Follow for more ', l2 = 'AI, decoded.', size = 50;
  const w1 = measure(l1, size, 700, DISPLAY, -1), w2 = measure(l2, size, 700, DISPLAY, -1), x0 = 540 - (w1 + w2) / 2;
  maskText(l1, x0, 1265, size, { weight: 700, fam: DISPLAY, color: C.ink, spacing: -1 }, prog(t, c0, c0 + .7));
  maskText(l2, x0 + w1, 1265, size, { weight: 700, fam: DISPLAY, color: '#ffb547', spacing: -1 }, prog(t, c0 + .12, c0 + .82));
  const bk2 = eQuint(prog(t, c0 + .4, c0 + 1.0));
  if (bk2 > 0) {
    const pp = prog(t, o.tap - .08, o.tap + .22), press = 1 - .07 * Math.sin(Math.PI * pp);
    const fill = eCubic(prog(t, o.tap, o.tap + .3));
    const bw = 340, bh = 92, bx = 540, by = 1385;
    ctx.save(); ctx.globalAlpha *= bk2;
    ctx.translate(bx, by + (1 - bk2) * 30); ctx.scale(press * lerp(.85, 1, bk2), press * lerp(.85, 1, bk2));
    ctx.beginPath(); ctx.roundRect(-bw / 2, -bh / 2, bw, bh, bh / 2);
    ctx.fillStyle = `rgba(255,181,71,${.08 + .92 * fill})`; ctx.fill();
    ctx.strokeStyle = '#ffb547'; ctx.lineWidth = 2.5; ctx.shadowColor = '#ffb547'; ctx.shadowBlur = 20 + 20 * fill; ctx.stroke();
    ctx.shadowBlur = 0;
    const rp = prog(t, o.tap, o.tap + .6);               // tap ripple
    if (rp > 0 && rp < 1) {
      ctx.save(); ctx.clip(); ctx.fillStyle = `rgba(255,255,255,${.35 * (1 - rp)})`;
      ctx.beginPath(); ctx.arc(70, 10, 260 * eCubic(rp), 0, 6.2832); ctx.fill(); ctx.restore();
    }
    const sw = eCubic(prog(t, o.tap + .05, o.tap + .35));
    ctx.save(); ctx.beginPath(); ctx.rect(-bw / 2, -bh / 2, bw, bh); ctx.clip();
    txt('+  Follow', 0, 12 - sw * 50, { size: 34, weight: 700, fam: SANS, color: '#ffb547', align: 'center', alpha: 1 - sw });
    txt('✓  Following', 0, 12 + (1 - sw) * 50, { size: 34, weight: 700, fam: SANS, color: '#1a1205', align: 'center', alpha: sw });
    ctx.restore();
    ctx.restore();
  }
}

// ---------------- frame ----------------
function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const acc = accentAt(t);
  background(t, acc);
  const fade = eCubic(prog(t, 0, .9)) * (1 - eCubic(prog(t, TL.duration - 1.0, TL.duration - .1)));
  ctx.save(); ctx.globalAlpha = fade;
  drawCloud(t, fade * (1 - eCubic(prog(t, E.outro.reveal + .15, E.outro.reveal + .8))));
  if (window.PLATE) { ctx.restore(); return; }     // seed frame for Higgsfield: no type
  if (t < SC.jev.t0 + .2) sLLM(t);
  if (t > SC.jev.t0 - 1 && t < SC.cdm.t0 + .2) sJev(t);
  if (t > SC.cdm.t0 - 1 && t < SC.end.t0 + .2) sCDM(t);
  if (t > SC.end.t0 - 1 && t < SC.outro.t0 + .2) sEnd(t);
  if (t > SC.outro.t0) sOutro(t);
  ctx.restore();
  captions(t);
  grain(t);
  ctx.fillStyle = rgba(acc, .7); ctx.fillRect(0, H - 4, W * t / TL.duration, 4);
}

window.init = (tl, logoSrc) => {
  TL = tl; E = tl.events; for (const s of tl.scenes) SC[s.id] = s;
  LOGO_IMG = new Image(); LOGO_IMG.src = logoSrc || 'assets/optimizer_step_logo.png';
  WM = document.createElement('canvas'); WM.width = 1254; WM.height = 190;
  const keyBand = () => {
    KEY = document.createElement('canvas'); KEY.width = 1254; KEY.height = 240;
    const k = KEY.getContext('2d'); k.drawImage(LOGO_IMG, 0, 880, 1254, 240, 0, 0, 1254, 240);
    const im = k.getImageData(0, 0, 1254, 240), d = im.data;
    for (let i = 0; i < d.length; i += 4) {
      const m = Math.max(d[i], d[i + 1], d[i + 2]), a = clamp((m - 30) / 80);
      d[i + 3] = 255 * a * a * (3 - 2 * a);
    }
    k.putImageData(im, 0, 0);
  };
  return LOGO_IMG.decode().then(keyBand).then(() => document.fonts.ready).then(() => Promise.all([
    document.fonts.load(`700 100px ${DISPLAY}`), document.fonts.load(`600 40px ${SANS}`), document.fonts.load(`500 40px ${SANS}`),
    document.fonts.load(`700 40px ${MONO}`), document.fonts.load(`500 40px ${MONO}`), document.fonts.load(`600 40px ${MONO}`)]))
    .then(() => { layoutTokens(); KEYS = keys(); });
};
window.renderFrame = renderFrame;

if (!location.search.includes('capture')) {
  fetch('build/timeline.json').then(r => r.json()).then(window.init).then(() => {
    renderFrame(0);
    const audio = new Audio('build/mix.wav');
    document.getElementById('play').onclick = e => {
      e.target.remove(); audio.play();
      const loop = () => { renderFrame(audio.currentTime); if (!audio.ended) requestAnimationFrame(loop); };
      loop();
    };
  });
} else document.body.classList.add('capture');
</script>
